name: ai-calling-agent-production
services:
  api:
    build:
      context: ../../apps/api
    env_file:
      - ../../.env.production
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]

  worker:
    build:
      context: ../../apps/api
    env_file:
      - ../../.env.production
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --concurrency=2 -Q voice
    networks: [app]

  postgres:
    image: postgres:17-alpine
    env_file:
      - ../../.env.production
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:8-alpine
    env_file:
      - ../../.env.production
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  redisdata:
