services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: voice, POSTGRES_PASSWORD: voice, POSTGRES_DB: voice}
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U voice -d voice"], interval: 5s, timeout: 5s, retries: 10}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    ports: ["6380:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8001:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    build: ./apps/api
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO -Q voice
  web:
    image: node:22-alpine
    working_dir: /app
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1}
    volumes: [./apps/web:/app]
    ports: ["3001:3000"]
    command: sh -c "npm install && npm run dev"
    depends_on: [api]
volumes: {pgdata: {}}
