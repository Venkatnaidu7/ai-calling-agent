name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U voice -d voice"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:8
        ports: ['6379:6379']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r apps/api/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q apps/api/app
      - name: Run backend tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://voice:voice@localhost:5432/voice
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret
        run: PYTHONPATH=. pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
